[pytest]
# Pytest configuration for review-heatmap

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Command line options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on warnings in config
    --strict-config

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    timezone: marks tests that test timezone functionality
    collection: marks tests that require Anki collections

# Output options
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    # Ignore specific warnings from dependencies
    ignore::DeprecationWarning:anki.*
    ignore::DeprecationWarning:aqt.*

# Coverage (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=review_heatmap --cov-report=html --cov-report=term-missing
